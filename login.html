<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — LXX Language XTRAX</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <span class="hex">⬡</span>
    <span>LXX <span class="version">v1.0.0</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="download.html">Download</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="hex">⬡</span>
      <h1>LXX</h1>
      <p>Language XTRAX — Your Account</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div id="error-msg" class="form-error"></div>
    <div id="success-msg" class="form-success"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="submit-btn" id="login-btn">Sign In</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="signup-pass">Password</label>
        <input type="password" id="signup-pass" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="signup-pass2">Confirm Password</label>
        <input type="password" id="signup-pass2" placeholder="Repeat password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="submit-btn" id="signup-btn">Create Account</button>
    </form>

    <p class="text-center text-muted mt-2" style="font-size:0.78rem; line-height:1.5;">
      By creating an account you agree to our terms of service.
    </p>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  Auth.redirectIfAuthed();

  function switchTab(tab) {
    document.getElementById("tab-login").classList.toggle("active", tab === "login");
    document.getElementById("tab-signup").classList.toggle("active", tab === "signup");
    document.getElementById("login-form").style.display  = tab === "login"  ? "" : "none";
    document.getElementById("signup-form").style.display = tab === "signup" ? "" : "none";
    clearMessages();
  }

  function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg; el.style.display = "block";
    document.getElementById("success-msg").style.display = "none";
  }

  function showSuccess(msg) {
    const el = document.getElementById("success-msg");
    el.textContent = msg; el.style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }

  function clearMessages() {
    document.getElementById("error-msg").style.display = "none";
    document.getElementById("success-msg").style.display = "none";
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Signing in…";
    clearMessages();
    try {
      await Auth.login(
        document.getElementById("login-email").value.trim(),
        document.getElementById("login-pass").value
      );
      showSuccess("✓ Signed in! Redirecting…");
      setTimeout(() => window.location.href = "dashboard.html", 600);
    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = "Sign In";
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const pass  = document.getElementById("signup-pass").value;
    const pass2 = document.getElementById("signup-pass2").value;
    if (pass !== pass2) { showError("Passwords do not match"); return; }
    if (pass.length < 6) { showError("Password must be at least 6 characters"); return; }

    const btn = document.getElementById("signup-btn");
    btn.disabled = true; btn.textContent = "Creating account…";
    clearMessages();
    try {
      await Auth.signup(
        document.getElementById("signup-email").value.trim(),
        pass
      );
      showSuccess("✓ Account created! Redirecting…");
      setTimeout(() => window.location.href = "dashboard.html", 700);
    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = "Create Account";
    }
  }
</script>
</body>
</html>
